<style>
/* ---------- Contenedor y aislamiento ---------- */
#seccion-tecnoteca-hero {
  --tt-accent: #EAB308;        /* amarillo con cuerpo */
  --tt-accent-deep: #CA8A04;
  --tt-ink: #0F0F0F;
  --tt-white: #FFFFFF;
  --tt-ease: cubic-bezier(.23, 1, .32, 1);
  position: relative; isolation: isolate; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; min-height: 100svh;
  padding: clamp(88px, 14vw, 140px) clamp(16px, 5vw, 48px) clamp(56px, 9vw, 96px);
  background: var(--tt-ink); color: var(--tt-white);
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  line-height: 1.5; text-align: center; -webkit-font-smoothing: antialiased;
}
#seccion-tecnoteca-hero *, #seccion-tecnoteca-hero *::before, #seccion-tecnoteca-hero *::after { box-sizing: border-box; }
#seccion-tecnoteca-hero :where(h1, p, a, button, img, video) { margin: 0; }

/* ---------- Video de fondo ---------- */
#seccion-tecnoteca-hero .tt-media { position: absolute; inset: 0; z-index: -2; overflow: hidden;
  background: radial-gradient(80% 60% at 80% 0%, rgba(234,179,8,.35), transparent 70%), linear-gradient(160deg, #1a1608, #0F0F0F 60%); }
#seccion-tecnoteca-hero .tt-video { width: 100%; height: 100%; object-fit: cover; object-position: 50% 32%; display: block; filter: brightness(.4) saturate(.85); }
#seccion-tecnoteca-hero .tt-shade { position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(to bottom, rgba(15,15,15,.62), rgba(15,15,15,.5) 45%, rgba(15,15,15,.88)); }

/* ---------- Panel Liquid Glass ---------- */
#seccion-tecnoteca-hero .tt-glass {
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.06)), rgba(30,30,30,.42);
  -webkit-backdrop-filter: blur(30px) saturate(170%); backdrop-filter: blur(30px) saturate(170%);
  border: 1px solid rgba(255,255,255,.26);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(255,255,255,.05), 0 24px 70px -18px rgba(0,0,0,.7);
}
#seccion-tecnoteca-hero .tt-glass::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(320px circle at var(--tt-mx, 50%) var(--tt-my, 50%), rgba(255,255,255,.16), transparent 60%);
  transition: opacity .3s var(--tt-ease); }
#seccion-tecnoteca-hero .tt-glass:hover::before { opacity: 1; }

#seccion-tecnoteca-hero .tt-panel { width: 100%; max-width: 820px; border-radius: clamp(24px, 4vw, 36px);
  padding: clamp(28px, 6vw, 64px) clamp(20px, 5vw, 56px); display: flex; flex-direction: column; align-items: center; }

/* ---------- Marca ---------- */
#seccion-tecnoteca-hero .tt-brand { display: inline-flex; align-items: center; gap: 10px;
  font-family: 'Montserrat', 'Inter', sans-serif; font-weight: 800; font-size: clamp(1.05rem, 2.6vw, 1.25rem); letter-spacing: -.01em; }
#seccion-tecnoteca-hero .tt-brand img { width: clamp(32px, 6vw, 40px); height: auto; display: block; } /* PERSONALIZAR: tamaño del logo */
#seccion-tecnoteca-hero .tt-brand b { color: var(--tt-accent); font-weight: 800; }

/* ---------- Textos ---------- */
#seccion-tecnoteca-hero .tt-title { margin-top: clamp(18px, 3.5vw, 28px); font-family: 'Montserrat', 'Inter', sans-serif; font-weight: 900;
  font-size: clamp(1.9rem, 6.4vw, 3.6rem); line-height: 1.06; letter-spacing: -.025em; text-wrap: balance; text-shadow: 0 2px 18px rgba(0,0,0,.45); }
#seccion-tecnoteca-hero .tt-title em { font-style: normal; color: var(--tt-accent); }
#seccion-tecnoteca-hero .tt-sub { margin-top: clamp(12px, 2vw, 18px); font-weight: 500; font-size: clamp(1rem, 2.3vw, 1.25rem);
  color: rgba(255,255,255,.92); max-width: 34em; text-wrap: pretty; }

/* ---------- Botones (Liquid Glass + acento) ---------- */
#seccion-tecnoteca-hero .tt-actions { margin-top: clamp(24px, 4.5vw, 40px); display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; width: 100%; }
#seccion-tecnoteca-hero .tt-btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 14px 28px; border-radius: 999px; text-decoration: none; cursor: pointer;
  font-family: 'Inter', sans-serif; font-weight: 600; font-size: 1rem; color: var(--tt-white);
  background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
  -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%);
  border: 1px solid rgba(255,255,255,.2);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 10px 30px -10px rgba(0,0,0,.6);
  transition: transform .18s var(--tt-ease), border-color .25s var(--tt-ease), box-shadow .25s var(--tt-ease), background .25s var(--tt-ease); }
#seccion-tecnoteca-hero .tt-btn::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s var(--tt-ease);
  background: radial-gradient(160px circle at var(--tt-mx, 50%) var(--tt-my, 50%), rgba(255,255,255,.4), transparent 60%); }
#seccion-tecnoteca-hero .tt-btn:hover { transform: translateY(-2px); border-color: rgba(234,179,8,.7); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 14px 38px -10px rgba(234,179,8,.45); }
#seccion-tecnoteca-hero .tt-btn:hover::before { opacity: 1; }
#seccion-tecnoteca-hero .tt-btn:active { transform: scale(.97); }
#seccion-tecnoteca-hero .tt-btn:focus-visible { outline: 2px solid var(--tt-accent); outline-offset: 3px; }
#seccion-tecnoteca-hero .tt-btn--primary { color: #1a1400; border-color: rgba(255,235,150,.55);
  background: linear-gradient(135deg, rgba(250,204,21,.96), rgba(202,138,4,.94));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 12px 34px -8px rgba(234,179,8,.55); }
#seccion-tecnoteca-hero .tt-btn--primary:hover { border-color: rgba(255,245,200,.95); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 16px 46px -8px rgba(234,179,8,.75); }
#seccion-tecnoteca-hero .tt-btn svg { width: 1.3em; height: 1.3em; flex: none; fill: currentColor; }

/* ---------- Responsive ---------- */
@media (max-width: 560px) {
  #seccion-tecnoteca-hero .tt-actions { flex-direction: column; align-items: stretch; }
  #seccion-tecnoteca-hero .tt-btn { width: 100%; }
}
@media (min-width: 1100px) { #seccion-tecnoteca-hero .tt-panel { max-width: 900px; } }
@media (prefers-reduced-motion: reduce) {
  #seccion-tecnoteca-hero *, #seccion-tecnoteca-hero *::before { transition: none !important; }
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  #seccion-tecnoteca-hero .tt-glass, #seccion-tecnoteca-hero .tt-btn:not(.tt-btn--primary) { background: rgba(30,30,30,.82); }
}
</style>

<script>
/* Comportamiento del módulo: destello que sigue al cursor + respeto por "reducir movimiento" */
(function () {
  var root = document.getElementById('seccion-tecnoteca-hero');
  if (!root) return;
  root.querySelectorAll('.tt-glass, .tt-btn').forEach(function (el) {
    el.addEventListener('pointermove', function (e) {
      var r = el.getBoundingClientRect();
      el.style.setProperty('--tt-mx', (e.clientX - r.left) + 'px');
      el.style.setProperty('--tt-my', (e.clientY - r.top) + 'px');
    });
  });
  var v = root.querySelector('.tt-video');
  if (v) {
    /* Video decorativo: siempre silenciado y en bucle continuo */
    v.muted = true; v.defaultMuted = true; v.loop = true; v.playsInline = true;
    var play = function () { var p = v.play(); if (p && p.catch) p.catch(function () {}); };
    v.addEventListener('ended', function () { v.currentTime = 0; play(); });           /* respaldo del bucle */
    v.addEventListener('pause', function () { if (!v.ended && !document.hidden) setTimeout(play, 150); }); /* si el navegador lo frena, retoma */
    v.addEventListener('canplay', play);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) play(); });
    ['pointerdown', 'touchstart', 'keydown', 'scroll'].forEach(function (ev) {         /* modo ahorro de batería: arranca al primer toque */
      window.addEventListener(ev, function () { if (v.paused) play(); }, { passive: true, once: false });
    });
    play();
  }
})();
</script>
